# Typecheck, unit tests and both bundles, on every push and pull request.
#
# No device and no adb are involved: the suite runs against a committed H.264
# fixture and a stubbed `vscode` module, so it is the same work locally and here.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A later push makes an in-flight run irrelevant. Cancelling keeps the queue
# honest on a branch being pushed to repeatedly.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Both ends of what the README claims: 22 is the documented minimum, which
      # is the one that can break without anyone noticing, and 24 is what this
      # is developed on. The tests run TypeScript directly through Node's type
      # stripping, so the Node version is not an incidental detail here.
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # typecheck (three projects) + unit tests + build.
      - run: npm run check
